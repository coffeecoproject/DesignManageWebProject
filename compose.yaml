# Local development dependencies, run by napbox (one isolated environment per git worktree).
# Host ports are assigned by napbox and stay fixed for the environment; read them with `napbox env`.
# Local-only credentials; never reuse them outside local development.

x-napbox:
  # Port for the web dev server that runs on the host; scripts/local/dev-web.sh reads NAPBOX_HOST_WEB.
  host_ports: [web]

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: startupmanage_local
      POSTGRES_USER: startupmanage_app
      POSTGRES_PASSWORD: startupmanage_local_dev_only
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # TCP, not the socket: on first start the init server listens on the socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 1s
      timeout: 5s
      retries: 60

volumes:
  pgdata:
